<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BlogRites Content Editor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Content Files</h1>
      <ul id="file-list"></ul>
    </aside>
    <main class="editor">
      <div id="empty-state" class="empty-state">Select a file on the left to start editing.</div>
      <div id="editor-header" class="editor-header hidden">
        <h2 id="editor-title"></h2>
        <div class="actions">
          <span id="save-status" class="save-status"></span>
          <button id="save-btn" class="save-btn">Save</button>
        </div>
      </div>
      <form id="editor-form" class="editor-form hidden"></form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
