<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Public-safe project directory tree</title>
  <desc id="desc">A stylized editor panel showing a clean web project folder structure with generic files and folders.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="14" fill="#0b0f19"/>
  <path d="M0 310 C95 258 160 354 246 302 C340 245 400 312 600 244 L600 400 L0 400 Z" fill="#111827" opacity="0.72"/>
  <circle cx="514" cy="92" r="64" fill="#38bdf8" opacity="0.08"/>
  <circle cx="88" cy="318" r="72" fill="#a855f7" opacity="0.08"/>

  <g filter="url(#soft-shadow)">
    <rect x="46" y="36" width="508" height="328" rx="16" fill="url(#panel)" stroke="#2d3748"/>
    <rect x="46" y="36" width="508" height="46" rx="16" fill="#1f2937"/>
    <path d="M46 66 H554 V82 H46 Z" fill="#1f2937"/>
    <rect x="62" y="51" width="16" height="16" rx="4" fill="#294172"/>
    <path d="M67 60 C67 56 73 56 73 60 V63 C73 66 67 66 67 63 Z" fill="none" stroke="#f3f4f6" stroke-width="1.5"/>
    <path d="M70 56 H73 C76 56 76 60 73 60 H70" fill="none" stroke="#f3f4f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M478 59 H490" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="506" y="53" width="12" height="12" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
    <path d="M535 55 L545 65 M545 55 L535 65" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
    <text x="300" y="64" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">public-project-tree</text>
  </g>

  <rect x="72" y="105" width="456" height="226" rx="12" fill="#0f172a" stroke="#2d3748"/>
  <rect x="72" y="105" width="456" height="34" rx="12" fill="#111827"/>
  <path d="M72 126 H528 V139 H72 Z" fill="#111827"/>
  <text x="94" y="127" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">ritesdev-site/</text>
  <text x="429" y="127" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ready to share</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d1d5db">
    <g transform="translate(96 166)">
      <path d="M0 0 H10 V132" stroke="#374151" stroke-width="2" fill="none"/>
      <path d="M10 0 H22 M10 33 H22 M10 66 H22 M10 99 H22 M10 132 H22" stroke="#374151" stroke-width="2"/>

      <g transform="translate(22 -8)">
        <path d="M0 6 H14 L18 11 H40 A4 4 0 0 1 44 15 V28 A4 4 0 0 1 40 32 H4 A4 4 0 0 1 0 28 Z" fill="url(#folder)" opacity="0.95"/>
        <text x="56" y="24" fill="#f3f4f6">src/</text>
      </g>
      <g transform="translate(60 25)">
        <path d="M0 6 H14 L18 11 H40 A4 4 0 0 1 44 15 V28 A4 4 0 0 1 40 32 H4 A4 4 0 0 1 0 28 Z" fill="#38bdf8" opacity="0.72"/>
        <text x="56" y="24">components/</text>
      </g>
      <g transform="translate(60 58)">
        <path d="M0 6 H14 L18 11 H40 A4 4 0 0 1 44 15 V28 A4 4 0 0 1 40 32 H4 A4 4 0 0 1 0 28 Z" fill="#10b981" opacity="0.76"/>
        <text x="56" y="24">pages/</text>
      </g>
      <g transform="translate(60 91)">
        <path d="M0 6 H14 L18 11 H40 A4 4 0 0 1 44 15 V28 A4 4 0 0 1 40 32 H4 A4 4 0 0 1 0 28 Z" fill="#a855f7" opacity="0.78"/>
        <text x="56" y="24">styles/</text>
      </g>
      <g transform="translate(22 124)">
        <path d="M7 0 H29 L42 13 V42 A5 5 0 0 1 37 47 H7 A5 5 0 0 1 2 42 V5 A5 5 0 0 1 7 0 Z" fill="#1f2937" stroke="#4b5563"/>
        <path d="M29 0 V13 H42" fill="none" stroke="#4b5563"/>
        <text x="56" y="31" fill="#f3f4f6">README.md</text>
      </g>
    </g>

    <g transform="translate(346 171)">
      <rect x="0" y="0" width="132" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="20" fill="#38bdf8">site.json</text>
      <rect x="0" y="42" width="132" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="62" fill="#10b981">index.astro</text>
      <rect x="0" y="84" width="132" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="104" fill="#a855f7">global.css</text>
    </g>
  </g>

  <path d="M112 303 H488" stroke="#2d3748" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="300" y="322" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">clean structure - no private paths - portfolio ready</text>
</svg>
